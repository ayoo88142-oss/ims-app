name: Build IMS
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
      - name: Sauvegarder IMS
        run: cp lib/main.dart /tmp/ims_main.dart
      - name: Réparer Gradle
        run: flutter create -t app --platforms=android --project-name ims_app. --overwrite
      - name: Restaurer IMS
        run: cp /tmp/ims_main.dart lib/main.dart
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: ims-app-apk
          path: build/app/outputs/flutter-apk/app-release.ap
